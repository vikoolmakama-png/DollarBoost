<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | DollarBoost</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-container">
    <a href="/" class="logo">DOLLAR<span>BOOST</span></a>

    <div class="auth-box">
        <div class="badge">WELCOME BACK</div>
        <h1>Welcome Back</h1>
        <p>Login to access your DollarBoost account.</p>

        {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <div class="alert">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Username</label>
            <input name="username" placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button class="primary-btn full">LOGIN TO ACCOUNT →</button>
        </form>

        <p class="bottom-text">
            Don't have an account? <a href="/register">Register</a>
        </p>
    </div>
</div>

</body>
</html>
