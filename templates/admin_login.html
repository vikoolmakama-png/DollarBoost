<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | DollarBoost</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#123b69,#071326 55%,#030914);font-family:Arial,sans-serif;color:white}
.glow{position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(100px);background:#087bff;opacity:.25;top:10%;left:10%}
.glow.two{background:#00e5a0;top:auto;left:auto;right:5%;bottom:5%}
.card{position:relative;width:100%;max-width:420px;padding:38px 27px;background:rgba(12,29,54,.88);border:1px solid rgba(67,160,255,.45);border-radius:23px;box-shadow:0 0 35px rgba(0,133,255,.18),inset 0 0 25px rgba(0,130,255,.05)}
.logo{width:75px;height:75px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#087bff,#00d6a0);font-size:29px;font-weight:900;box-shadow:0 0 25px #087bff66}
h1{text-align:center;margin:0;font-size:27px;letter-spacing:1px}
.sub{text-align:center;color:#91a9c8;font-size:13px;margin:10px 0 30px}
label{display:block;color:#b9cce5;font-size:13px;margin:18px 0 8px}
input{width:100%;padding:15px;border:1px solid #29496e;border-radius:11px;background:#07182d;color:white;font-size:15px;outline:none}
input:focus{border-color:#168cff;box-shadow:0 0 13px #087bff55}
button{width:100%;padding:15px;border:0;border-radius:11px;margin-top:24px;background:linear-gradient(100deg,#087bff,#00c995);color:white;font-weight:bold;font-size:15px;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 22px #087bff44}
button:active{transform:scale(.98)}
.flash{padding:12px;border-radius:9px;background:#652b3b;color:#ffd9df;text-align:center;font-size:13px;margin:12px 0}
.footer{text-align:center;color:#607b9d;font-size:11px;margin-top:28px}
</style>
</head>
<body>
<div class="glow"></div><div class="glow two"></div>
<main class="card">
<div class="logo">DB</div>
<h1>DOLLARBOOST</h1>
<p class="sub">ADMINISTRATION PORTAL · SECURE ACCESS</p>
{% with messages = get_flashed_messages() %}
{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
{% endwith %}
<form method="POST">
<label>ADMIN USERNAME</label>
<input type="text" name="username" placeholder="Enter admin username" required autocomplete="username">
<label>ADMIN PASSWORD</label>
<input type="password" name="password" placeholder="Enter admin password" required autocomplete="current-password">
<button type="submit">SECURE LOGIN →</button>
</form>
<div class="footer">PROTECTED ADMINISTRATOR ACCESS · DOLLARBOOST</div>
</main>
</body>
</html>
